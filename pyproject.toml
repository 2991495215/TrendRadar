[project]
name = "trendradar"
version = "6.11.0"
description = "TrendRadar - 热点新闻聚合与分析工具"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "pytz==2026.6",
    "PyYAML==6.0.3",
    "fastmcp==4.1.5",
    "websockets==17.4",
    "authlib==1.9.2",
    "anyio==4.16.0",
    "feedparser==6.0.14",
    "boto3==1.43.123",
    "litellm==1.106.6",
    "json-repair>=0.60.1",
    "tenacity==9.2.1",
    "urllib3>=2.8.0",
    "starlette>=1.7.0",
]

[project.scripts]
trendradar = "trendradar.__main__:main"
trendradar-mcp = "mcp_server.server:run_server"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendradar", "mcp_server"]
